[project]
name = "zhoutomo-protocol"
version = "0.1.0"
description = "Platform-independent protocol models shared by ZhouTomo client and server"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhoutomo_protocol"]
