[project]
name = "zhoutomo-server"
version = "0.1.0"
description = "ZhouTomo microscope-control server"
requires-python = ">=3.10,<3.11"
dependencies = [
    "zhoutomo-protocol",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "numpy>=1.24,<2",
    "pillow>=10.0",
    "python-json-logger>=2.0",
    "websockets>=12.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
hardware = ["temscript>=1.0.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.6",
    "mypy>=1.7",
]

[project.scripts]
zhoutomo-server = "zhoutomo_server.main:main"

[tool.uv.sources]
zhoutomo-protocol = { path = "../protocol", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["domain", "wiring", "ports_temscript", "server_fastapi", "run_agent"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zhoutomo_server*"]
