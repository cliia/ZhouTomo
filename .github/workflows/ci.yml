name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest tests
      - run: uv run python -c "import zhoutomo_protocol"

  server:
    name: Server (no hardware)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest tests
      - run: uv run python -c "import zhoutomo_server; from zhoutomo_server.api import create_app; create_app()"

  client:
    name: Client
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest tests
      - run: uv run python -c "import zhoutomo_client; import zhoutomo_protocol"
