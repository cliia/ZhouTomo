name: Client Import Migration

on:
  push:
    branches:
      - refactor/uv-monorepo
    paths:
      - scripts/migrate_client_imports.py
      - .github/workflows/client-import-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Rewrite legacy imports
        run: python scripts/migrate_client_imports.py

      - name: Install client
        working-directory: client
        run: uv sync --extra dev

      - name: Run client tests
        working-directory: client
        run: uv run pytest tests

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/zhoutomo_client
          if (git diff --cached --quiet) {
            Write-Host "No migration changes to commit."
            exit 0
          }
          git commit -m "refactor: migrate client imports to package namespace"
          git push origin HEAD:refactor/uv-monorepo
