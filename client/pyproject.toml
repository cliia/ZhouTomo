[project]
name = "zhoutomo-client"
version = "0.1.0"
description = "ZhouTomo desktop client and acquisition workflows"
requires-python = ">=3.10,<3.11"
dependencies = [
    "zhoutomo-protocol",
    # Newer PyQt5-Qt5 releases do not currently publish Windows wheels.
    # Pin the Qt runtime explicitly for the Windows desktop client.
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "qasync>=0.24",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "aiohttp>=3.8",
    "websockets>=12.0",
    "python-json-logger>=2.0",
    "opencv-python>=4.12",
    "scipy>=1.15",
    "scikit-image>=0.22",
    "bm3d>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.6",
]

[project.scripts]
zhoutomo-client = "zhoutomo_client.main:main"

[tool.uv.sources]
zhoutomo-protocol = { path = "../protocol", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["zhoutomo_client*"]

[tool.setuptools.package-data]
"zhoutomo_client.resources" = ["*.md", "background/*", "icons/*"]
"zhoutomo_client.processing.legacy" = ["*.mat"]
